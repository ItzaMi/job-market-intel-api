services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uv run fastapi dev main.py --host 0.0.0.0
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/job_market_intel
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: job_market_intel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
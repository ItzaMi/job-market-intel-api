[project]
name = "job-market-intel-api"
version = "0.1.0"
description = "A FastAPI/PostgreSQL API for tracking job listings and analyzing remote tech market trends."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "celery>=5.6.3",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "redis>=6.4.0",
    "sqlmodel>=0.0.39",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
package = true
